name: CI — SpeakMate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun tsc --noEmit 2>/dev/null || echo "No tsconfig, skipping"

  health-check:
    name: Post-deploy Health Check
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Wait for Railway deploy (90s)
        run: sleep 90

      - name: Check SpeakMate health endpoint
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              "https://acceptable-purpose-production-09b3.up.railway.app/health")
            if [ "$STATUS" = "200" ]; then
              echo "✅ SpeakMate healthy (attempt $i)"
              exit 0
            fi
            echo "⏳ Attempt $i: HTTP $STATUS — waiting 30s..."
            sleep 30
          done
          echo "❌ SpeakMate health check failed after 5 attempts"
          exit 1

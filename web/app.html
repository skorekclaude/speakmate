<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpeakMate</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

  <!-- Nav Bar -->
  <nav class="nav-bar" id="navBar"></nav>

  <!-- Agent Carousel -->
  <div class="agent-bar" id="agentBar"></div>

  <!-- Chat Area -->
  <div class="chat-area" id="chatArea">
    <div class="welcome-msg" id="welcomeMsg">
      <div class="welcome-emoji">🎓</div>
      <h2>Hey! I'm Kasiunia</h2>
      <p>Your English conversation partner. Say something and I'll help you improve!</p>
    </div>
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <button class="mic-btn" id="micBtn" title="Hold to talk">🎤</button>
    <div class="input-wrapper">
      <textarea id="messageInput" placeholder="Type in English..." rows="1"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" title="Send">➤</button>
  </div>

  <script src="/assets/shared.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>

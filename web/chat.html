<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>ALLMA — Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1A1A2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALLMA">
  <link rel="apple-touch-icon" href="/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/assets/style.css">
  <script>
    // Prevent dark mode flash — apply theme before CSS renders
    (function(){var t=localStorage.getItem('allma_theme');if(!t)t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();
  </script>
</head>
<body>
  <div class="chat-layout">
    <!-- Header (full width) -->
    <div class="chat-header">
      <div class="chat-header-left">
        <span class="chat-header-logo">🧠</span>
        <h1>ALLMA</h1>
        <span class="specialist-badge" id="specialistBadge" style="display: none;">
          <span class="badge-emoji" id="badgeEmoji"></span>
          <span id="badgeName"></span>
        </span>
      </div>
      <div class="chat-header-right">
        <button class="lang-btn" data-lang="en" title="English">EN</button>
        <button class="lang-btn" data-lang="pl" title="Polski">PL</button>
        <button class="lang-btn" data-lang="pt" title="Português">PT</button>
        <button class="lang-btn" data-lang="es" title="Español">ES</button>
        <button class="lang-btn" data-lang="de" title="Deutsch">DE</button>
        <button class="lang-btn" data-lang="fr" title="Français">FR</button>
        <button class="lang-btn" data-lang="it" title="Italiano">IT</button>
        <button class="lang-btn" data-lang="zh" title="中文">中文</button>
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-dropdown-toggle" id="langDropdownToggle">
            <span id="currentLangLabel">EN</span> ▾
          </button>
          <div class="lang-dropdown-menu" id="langDropdownMenu">
            <button class="lang-btn" data-lang="en">🇬🇧 English</button>
            <button class="lang-btn" data-lang="pl">🇵🇱 Polski</button>
            <button class="lang-btn" data-lang="pt">🇧🇷 Português</button>
            <button class="lang-btn" data-lang="es">🇪🇸 Español</button>
            <button class="lang-btn" data-lang="de">🇩🇪 Deutsch</button>
            <button class="lang-btn" data-lang="fr">🇫🇷 Français</button>
            <button class="lang-btn" data-lang="it">🇮🇹 Italiano</button>
            <button class="lang-btn" data-lang="zh">🇨🇳 中文</button>
          </div>
        </div>
        <a href="/guide" class="guide-link" id="guideLink" title="How It Works">❓</a>
        <button class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">🌙</button>
        <button class="logout-btn" id="logoutBtn" title="Logout">⏻</button>
      </div>
    </div>

    <!-- 3-column body -->
    <div class="chat-body">
      <!-- LEFT SIDEBAR — Agent tiles -->
      <aside class="sidebar-left" id="sidebarLeft">
        <div class="sidebar-toggle-btn" id="sidebarToggle" title="Agents">☰</div>
        <div class="agent-tiles" id="agentTiles">
          <button class="agent-tile active" data-agent="core">
            <span class="agent-tile-emoji">🧠</span>
            <span class="agent-tile-name" data-i18n-agent="core">Auto</span>
          </button>
          <button class="agent-tile" data-agent="relations">
            <span class="agent-tile-emoji">❤️</span>
            <span class="agent-tile-name" data-i18n-agent="relations">Relations</span>
          </button>
          <button class="agent-tile" data-agent="career">
            <span class="agent-tile-emoji">💼</span>
            <span class="agent-tile-name" data-i18n-agent="career">Career</span>
          </button>
          <button class="agent-tile" data-agent="body">
            <span class="agent-tile-emoji">🏃</span>
            <span class="agent-tile-name" data-i18n-agent="body">Body</span>
          </button>
          <button class="agent-tile" data-agent="mindfulness">
            <span class="agent-tile-emoji">🧘</span>
            <span class="agent-tile-name" data-i18n-agent="mindfulness">Mind</span>
          </button>
          <button class="agent-tile" data-agent="habits">
            <span class="agent-tile-emoji">⚡</span>
            <span class="agent-tile-name" data-i18n-agent="habits">Habits</span>
          </button>
          <button class="agent-tile" data-agent="shadow">
            <span class="agent-tile-emoji">🪞</span>
            <span class="agent-tile-name" data-i18n-agent="shadow">Shadow</span>
          </button>
          <button class="agent-tile" data-agent="nutrition">
            <span class="agent-tile-emoji">🥗</span>
            <span class="agent-tile-name" data-i18n-agent="nutrition">Nutrition</span>
          </button>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <!-- CENTER — Chat -->
      <div class="chat-center">
        <div class="chat-messages" id="messagesContainer">
          <!-- Messages will be inserted here -->
        </div>

        <!-- Session warning (hidden by default) -->
        <div class="session-warning" id="sessionWarning" style="display: none;"></div>

        <!-- Input -->
        <div class="chat-input-area">
          <div class="chat-input-wrapper">
            <textarea
              class="chat-input"
              id="chatInput"
              placeholder="Type your message..."
              rows="1"
              autofocus
            ></textarea>
            <button class="mic-btn" id="micBtn" title="Voice input">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
              </svg>
            </button>
            <button class="send-btn" id="sendBtn" title="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- RIGHT SIDEBAR — Info panel -->
      <aside class="sidebar-right" id="sidebarRight">
        <div class="info-panel">
          <div class="info-panel-header">
            <span class="info-icon">ℹ️</span>
            <span data-i18n-info="title">Info</span>
          </div>
          <div class="info-panel-content" id="infoPanelContent">
            <div class="info-placeholder">
              <span class="info-placeholder-icon">✨</span>
              <p data-i18n-info="placeholder">Start a conversation to see insights here</p>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- BOTTOM BAR — Calorie counter -->
    <div class="calorie-bar" id="calorieBar">
      <div class="calorie-bar-inner">
        <div class="calorie-icon">🥗</div>
        <div class="calorie-stats">
          <span class="calorie-total" id="calorieTotal">0 kcal</span>
          <span class="calorie-divider">|</span>
          <span class="calorie-macro" id="calorieProtein">P: 0g</span>
          <span class="calorie-macro" id="calorieCarbs">C: 0g</span>
          <span class="calorie-macro" id="calorieFat">F: 0g</span>
        </div>
        <div class="calorie-label" data-i18n-info="today">Today</div>
      </div>
      <div class="calorie-tip" id="calorieTip"></div>
    </div>

    <!-- Mini footer links -->
    <div class="chat-footer-links">
      <a href="/guide">❓ Help</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="#" id="deleteHistoryLink" class="delete-history-link">🗑️ <span data-i18n-footer-delete="link">Delete history</span></a>
    </div>
  </div>

  <!-- Onboarding Modal -->
  <div class="modal-overlay" id="onboardingModal" style="display: none;">
    <div class="modal">
      <h2>🧠 Welcome to ALLMA</h2>
      <p>
        Let's get to know each other a bit. Answer these questions so I can better understand how to help you.
      </p>
      <form id="onboardingForm">
        <div class="onboarding-question">
          <label>1. What brings you here today? What would you like to work on?</label>
          <textarea id="q1" placeholder="e.g. I've been feeling stressed at work and want to understand my patterns better..."></textarea>
        </div>
        <div class="onboarding-question">
          <label>2. Have you done therapy or coaching before? What worked or didn't?</label>
          <textarea id="q2" placeholder="e.g. I did CBT for a year, it helped with anxiety but I stopped..."></textarea>
        </div>
        <div class="onboarding-question">
          <label>3. What's one thing you'd like to change about yourself in the next month?</label>
          <textarea id="q3" placeholder="e.g. I want to stop procrastinating on important decisions..."></textarea>
        </div>
        <button type="submit" class="btn-primary" style="width:100%; margin-top: 0.5rem;">
          Start Coaching Session
        </button>
      </form>
    </div>
  </div>

  <script src="/assets/chat.js"></script>
  <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/service-worker.js').catch(()=>{});</script>
</body>
</html>

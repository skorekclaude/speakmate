  <script>
    // ============================================================
    // Theme Toggle (dark/light)
    // ============================================================
    (function initTheme() {
      const toggle = document.getElementById('themeToggle');
      function getPreferredTheme() {
        const saved = localStorage.getItem('allma_theme');
        if (saved) return saved;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('allma_theme', theme);
        if (toggle) {
          toggle.textContent = theme === 'dark' ? '☀️' : '🌙';
          toggle.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
        }
        // PWA: update status bar / title bar color
        const m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = theme === 'dark' ? '#1A1A2E' : '#FAF8F5';
      }
      applyTheme(getPreferredTheme());
      if (toggle) {
        toggle.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme') || getPreferredTheme();
          applyTheme(current === 'dark' ? 'light' : 'dark');
        });
      }
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        if (!localStorage.getItem('allma_theme')) applyTheme(e.matches ? 'dark' : 'light');
      });
    })();

    // ============================================================
    // Language detection & switching
    // ============================================================
    let currentLang = 'en';

    function detectLanguage() {
      const saved = localStorage.getItem('allma_lang');
      if (saved && i18n[saved]) return saved;

      const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      const langMap = { pl: 'pl', pt: 'pt', es: 'es', de: 'de', fr: 'fr', it: 'it', zh: 'zh' };
      for (const [prefix, lang] of Object.entries(langMap)) {
        if (browserLang.startsWith(prefix)) return lang;
      }
      return 'en';
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('allma_lang', lang);
      const t = i18n[lang];

      // Update subtitle
      document.getElementById('subtitle').innerHTML = t.subtitle;

      // Update feature cards
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });

      // Update placeholders
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (t[key]) el.placeholder = t[key];
      });

      // Update specific elements
      document.getElementById('loginTitle').textContent = t.login_title;
      document.getElementById('loginBtn').textContent = t.login_btn;
      document.getElementById('disclaimer').innerHTML = t.disclaimer;
      document.getElementById('footerText').textContent = t.footer;

      // Footer links
      document.querySelectorAll('[data-i18n-footer]').forEach(el => {
        const key = el.getAttribute('data-i18n-footer');
        if (t[key]) el.textContent = t[key];
      });

      // Help link
      document.querySelectorAll('[data-i18n-help]').forEach(el => {
        const key = el.getAttribute('data-i18n-help');
        if (t[key]) el.textContent = t[key];
      });

      // Trust & Privacy section
      const trustEl = document.getElementById('trustSection');
      if (trustEl && t.trust_private) {
        trustEl.innerHTML = `
          <div class="trust-badge trust-highlight">${t.trust_private}</div>
          <div class="trust-badge">${t.trust_no_account}</div>
          <div class="trust-badge">${t.trust_encrypted}</div>
          <div class="trust-badge">${t.trust_no_training}</div>
          <div class="trust-badge">${t.trust_gdpr}</div>
          <div class="trust-badge">${t.trust_yours}</div>
          <div class="trust-badge trust-warning">${t.trust_remember}</div>
          <div class="trust-badge trust-opensource">${t.trust_opensource}</div>
        `;
      }

      // Update desktop lang buttons
      document.querySelectorAll('#langSwitcher .lang-btn-desktop').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      // Update mobile dropdown label
      const dropLabel = document.getElementById('currentLangLabelLanding');
      if (dropLabel) {
        const labelMap = { en: 'EN', pl: 'PL', pt: 'PT', es: 'ES', de: 'DE', fr: 'FR', it: 'IT', zh: '中文' };
        dropLabel.textContent = labelMap[lang] || lang.toUpperCase();
      }
      // Mark active in dropdown menu
      document.querySelectorAll('#langDropdownMenuLanding .lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      // Update page title
      const titles = {
        en: 'Your Personal Psychology Coach',
        pl: 'Twoj Osobisty Coach Psychologiczny',
        pt: 'Seu Coach Pessoal de Psicologia',
        es: 'Tu Coach Personal de Psicologia',
        de: 'Dein Personlicher Psychologie-Coach',
        fr: 'Votre Coach Personnel en Psychologie',
        it: 'Il Tuo Coach Personale di Psicologia',
        zh: '\u60a8\u7684\u4e2a\u4eba\u5fc3\u7406\u6559\u7ec3',
      };
      document.title = 'ALLMA — ' + (titles[lang] || titles.en);
    }

    // Init language
    currentLang = detectLanguage();
    setLanguage(currentLang);

    // Language switcher — desktop buttons
    document.querySelectorAll('#langSwitcher .lang-btn-desktop').forEach(btn => {
      btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
    });

    // Language switcher — mobile dropdown
    (function initLandingDropdown() {
      const toggle = document.getElementById('langDropdownToggleLanding');
      const menu = document.getElementById('langDropdownMenuLanding');
      if (!toggle || !menu) return;

      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        menu.classList.toggle('open');
      });

      document.addEventListener('click', () => {
        menu.classList.remove('open');
      });

      menu.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          setLanguage(btn.dataset.lang);
          menu.classList.remove('open');
        });
      });
    })();

    // ============================================================
    // Auth check
    // ============================================================
    (async function checkAuth() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        const data = await res.json();
        if (data.authenticated) {
          window.location.href = '/chat';
        }
      } catch {}
    })();

    // ============================================================
    // DOM — Direct login (no OTP)
    // ============================================================
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('emailInput');
    const nameInput = document.getElementById('nameInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const name = nameInput.value.trim();
      if (!email) return;

      const t = i18n[currentLang];
      loginBtn.disabled = true;
      loginBtn.textContent = t.login_btn_loading;
      loginError.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, name, language: currentLang }),
          credentials: 'include',
        });
        const data = await res.json();

        if (data.ok) {
          window.location.href = '/chat';
        } else {
          throw new Error(data.error || 'Login failed');
        }
      } catch (err) {
        loginError.textContent = err.message;
        loginError.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = t.login_btn;
      }
    });
  </script>

  <!-- PWA Install Prompt — Smart banner: Android native + iOS manual -->
  <script>
    (function() {
      const installI18n = {
        en: { text: 'Install ALLMA for quick access', btn: 'Install', menuHint: 'Tap ⋮ menu → "Install app"', iosHint: 'Tap Share ⬆ → "Add to Home Screen"' },
        pl: { text: 'Zainstaluj ALLMA na telefonie', btn: 'Instaluj', menuHint: 'Kliknij ⋮ menu → „Zainstaluj aplikację"', iosHint: 'Kliknij Udostępnij ⬆ → „Dodaj do ekranu głównego"' },
        pt: { text: 'Instale o ALLMA para acesso rápido', btn: 'Instalar', menuHint: 'Toque ⋮ menu → "Instalar app"', iosHint: 'Toque Compartilhar ⬆ → "Adicionar à Tela Inicial"' },
        es: { text: 'Instala ALLMA para acceso rápido', btn: 'Instalar', menuHint: 'Toca ⋮ menú → "Instalar app"', iosHint: 'Toca Compartir ⬆ → "Añadir a pantalla de inicio"' },
        de: { text: 'ALLMA installieren für schnellen Zugriff', btn: 'Installieren', menuHint: 'Tippe ⋮ Menü → „App installieren"', iosHint: 'Tippe Teilen ⬆ → „Zum Home-Bildschirm"' },
        fr: { text: 'Installez ALLMA pour un accès rapide', btn: 'Installer', menuHint: 'Appuyez ⋮ menu → « Installer »', iosHint: 'Appuyez Partager ⬆ → « Sur l\'écran d\'accueil »' },
        it: { text: 'Installa ALLMA per un accesso rapido', btn: 'Installa', menuHint: 'Tocca ⋮ menu → "Installa app"', iosHint: 'Tocca Condividi ⬆ → "Aggiungi alla Home"' },
        zh: { text: '安装 ALLMA 快速访问', btn: '安装', menuHint: '点击 ⋮ 菜单 → "安装应用"', iosHint: '点击 分享 ⬆ → "添加到主屏幕"' },
      };

      let deferredPrompt = null;
      const banner = document.getElementById('installBanner');
      const installBtn = document.getElementById('installBtn');
      const installDismiss = document.getElementById('installDismiss');
      const installText = document.getElementById('installText');

      // Platform detection
      const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isAndroid = /Android/.test(navigator.userAgent);
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

      // Dismiss: respect for 7 days (not forever)
      function isDismissed() {
        const ts = localStorage.getItem('allma_install_dismissed_at');
        if (!ts) return false;
        const days = (Date.now() - parseInt(ts)) / (1000 * 60 * 60 * 24);
        return days < 7;
      }

      function getLang() { return localStorage.getItem('allma_lang') || 'en'; }

      function updateInstallLang() {
        const lang = getLang();
        const t = installI18n[lang] || installI18n.en;
        if (isIOS) {
          if (installText) installText.innerHTML = t.text + '<br><small class="install-hint">' + t.iosHint + '</small>';
          if (installBtn) installBtn.style.display = 'none';
        } else if (deferredPrompt) {
          if (installText) installText.textContent = t.text;
          if (installBtn) { installBtn.textContent = t.btn; installBtn.style.display = ''; }
        } else {
          if (installText) installText.innerHTML = t.text + '<br><small class="install-hint">' + t.menuHint + '</small>';
          if (installBtn) installBtn.style.display = 'none';
        }
      }

      function showBanner() {
        if (isStandalone || isDismissed()) return;
        updateInstallLang();
        if (banner) banner.style.display = 'flex';
      }

      // Android: listen for native prompt
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        showBanner();
      });

      // Show banner on load for mobile (Android without prompt yet, or iOS)
      if ((isAndroid || isIOS) && !isStandalone && !isDismissed()) {
        // Small delay so page renders first
        setTimeout(showBanner, 1500);
      }

      if (installBtn) {
        installBtn.addEventListener('click', async function() {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          const result = await deferredPrompt.userChoice;
          deferredPrompt = null;
          if (banner) banner.style.display = 'none';
        });
      }

      if (installDismiss) {
        installDismiss.addEventListener('click', function() {
          if (banner) banner.style.display = 'none';
          localStorage.setItem('allma_install_dismissed_at', String(Date.now()));
        });
      }

      // ── Install links (below login + footer) ──
      const installLinkLogin = document.getElementById('installLinkLogin');
      const installLinkFooter = document.getElementById('installLinkFooter');

      const installLinkI18n = {
        en: 'Install app on your phone',
        pl: 'Zainstaluj aplikację na telefonie',
        pt: 'Instale o app no celular',
        es: 'Instala la app en tu teléfono',
        de: 'App auf dem Handy installieren',
        fr: 'Installer l\'app sur votre téléphone',
        it: 'Installa l\'app sul telefono',
        zh: '在手机上安装应用',
      };

      function updateInstallLinks() {
        const lang = getLang();
        const label = installLinkI18n[lang] || installLinkI18n.en;
        document.querySelectorAll('[data-i18n-install="link"]').forEach(function(el) {
          el.textContent = label;
        });
      }

      function handleInstallLinkClick(e) {
        e.preventDefault();
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function() { deferredPrompt = null; });
        } else {
          // Scroll to banner or show it
          showBanner();
          if (banner) banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      // Show install links on mobile (not when already installed)
      if ((isAndroid || isIOS) && !isStandalone) {
        if (installLinkLogin) { installLinkLogin.style.display = ''; installLinkLogin.addEventListener('click', handleInstallLinkClick); }
        if (installLinkFooter) { installLinkFooter.style.display = ''; installLinkFooter.addEventListener('click', handleInstallLinkClick); }
        updateInstallLinks();
      }

      // Update language when lang buttons change
      document.querySelectorAll('.lang-btn').forEach(function(btn) {
        btn.addEventListener('click', function() { updateInstallLang(); updateInstallLinks(); });
      });
    })();
  </script>

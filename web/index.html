<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeakMate — AI Language Tutor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .hero {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    .hero h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero .subtitle {
      font-size: 1.2rem;
      color: #888;
      margin-bottom: 2rem;
    }
    .agents-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .agent-card {
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 1rem;
      width: 150px;
      text-align: center;
      transition: transform 0.2s;
    }
    .agent-card:hover { transform: translateY(-4px); border-color: #667eea; }
    .agent-card .emoji { font-size: 2rem; margin-bottom: 0.5rem; }
    .agent-card .name { font-weight: 600; margin-bottom: 0.25rem; }
    .agent-card .desc { font-size: 0.75rem; color: #888; }
    .login-form {
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
    }
    .login-form input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #444;
      border-radius: 8px;
      background: #0d0d1a;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
    }
    .login-form input:focus { border-color: #667eea; }
    .login-form button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .login-form button:hover { opacity: 0.9; }
    .error { color: #ff6b6b; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>SpeakMate</h1>
    <p class="subtitle">AI Language Tutor — Learn English & Portuguese with native speakers</p>

    <div class="agents-preview">
      <div class="agent-card"><div class="emoji">🎓</div><div class="name">Alex</div><div class="desc">General English</div></div>
      <div class="agent-card"><div class="emoji">🔥</div><div class="name">Zara</div><div class="desc">Gen-Z Slang</div></div>
      <div class="agent-card"><div class="emoji">🧪</div><div class="name">Dr. Chen</div><div class="desc">Science</div></div>
      <div class="agent-card"><div class="emoji">💕</div><div class="name">Sam</div><div class="desc">Dating</div></div>
      <div class="agent-card"><div class="emoji">🎨</div><div class="name">Luna</div><div class="desc">Art & Philosophy</div></div>
      <div class="agent-card"><div class="emoji">🇧🇷</div><div class="name">Rafael</div><div class="desc">Portuguese</div></div>
    </div>

    <div class="login-form">
      <input type="email" id="emailInput" placeholder="Enter your email to start..." autocomplete="email" />
      <button id="loginBtn" onclick="doLogin()">Start Learning →</button>
      <p class="error" id="loginError"></p>
    </div>
  </div>

  <script>
    // Check if already logged in
    const token = localStorage.getItem('sm_token');
    if (token) window.location.href = '/app';

    async function doLogin() {
      const email = document.getElementById('emailInput').value.trim();
      const errorEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      if (!email) { errorEl.textContent = 'Please enter your email'; errorEl.style.display = 'block'; return; }

      btn.textContent = 'Logging in...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('sm_token', data.token);
        localStorage.setItem('sm_email', email);
        window.location.href = '/app';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        btn.textContent = 'Start Learning →';
        btn.disabled = false;
      }
    }

    document.getElementById('emailInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>

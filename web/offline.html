<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ALLMA — Offline</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1A1A2E">
  <script>
    (function(){var t=localStorage.getItem('allma_theme');if(!t)t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <style>
    :root { --bg: #FAF8F5; --text: #1a1a2e; --text-secondary: #666; --accent: #6C5CE7; }
    [data-theme="dark"] { --bg: #1A1A2E; --text: #E8E6F0; --text-secondary: #9B97B0; --accent: #A78BFA; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .offline-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.8; }
    .offline-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; }
    .offline-subtitle { color: var(--text-secondary); margin-bottom: 2rem; max-width: 300px; line-height: 1.5; }

    .retry-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .retry-btn:hover { opacity: 0.9; }
    .retry-btn:active { transform: scale(0.98); }

    .auto-retry { color: var(--text-secondary); font-size: 0.8rem; margin-top: 1rem; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="offline-icon">📡</div>
  <h1 class="offline-title">ALLMA</h1>
  <p class="offline-subtitle" id="subtitle">No internet connection. Check your network and try again.</p>
  <button class="retry-btn" id="retryBtn" onclick="location.reload()">Try Again</button>
  <p class="auto-retry" id="autoRetry">Will reconnect automatically...</p>

  <script>
    // i18n — detect from localStorage
    const lang = localStorage.getItem('allma_lang') || 'en';
    const i18n = {
      en: { sub: 'No internet connection. Check your network and try again.', btn: 'Try Again', auto: 'Will reconnect automatically...' },
      pl: { sub: 'Brak po\u0142\u0105czenia z internetem. Sprawd\u017a sie\u0107 i spr\u00f3buj ponownie.', btn: 'Spr\u00f3buj ponownie', auto: 'Po\u0142\u0105czy automatycznie...' },
      pt: { sub: 'Sem conex\u00e3o com a internet. Verifique sua rede e tente novamente.', btn: 'Tentar novamente', auto: 'Reconectar\u00e1 automaticamente...' },
      es: { sub: 'Sin conexi\u00f3n a internet. Verifica tu red e int\u00e9ntalo de nuevo.', btn: 'Intentar de nuevo', auto: 'Se reconectar\u00e1 autom\u00e1ticamente...' },
      de: { sub: 'Keine Internetverbindung. \u00dcberpr\u00fcfe dein Netzwerk und versuche es erneut.', btn: 'Erneut versuchen', auto: 'Verbindet automatisch...' },
      fr: { sub: 'Pas de connexion internet. V\u00e9rifiez votre r\u00e9seau et r\u00e9essayez.', btn: 'R\u00e9essayer', auto: 'Reconnexion automatique...' },
      it: { sub: 'Nessuna connessione internet. Controlla la rete e riprova.', btn: 'Riprova', auto: 'Si riconnetterà automaticamente...' },
      zh: { sub: '\u6ca1\u6709\u7f51\u7edc\u8fde\u63a5\u3002\u8bf7\u68c0\u67e5\u7f51\u7edc\u5e76\u91cd\u8bd5\u3002', btn: '\u91cd\u8bd5', auto: '\u5c06\u81ea\u52a8\u91cd\u65b0\u8fde\u63a5...' },
    };
    const t = i18n[lang] || i18n.en;
    document.getElementById('subtitle').textContent = t.sub;
    document.getElementById('retryBtn').textContent = t.btn;
    document.getElementById('autoRetry').textContent = t.auto;

    // Auto-reload when connection returns
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>

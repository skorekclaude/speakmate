    // ============================================================
    // i18n engine

    let currentLang = 'en';

    function applyLanguage(lang) {
      currentLang = lang;
      const t = i18n[lang] || i18n.en;
      document.getElementById('legalContent').innerHTML = t.content;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });
      document.querySelectorAll('.lang-btn-desktop').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      document.querySelectorAll('#langDropdownMenu .lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      const label = document.getElementById('currentLangLabel');
      if (label) label.textContent = lang === 'zh' ? '中文' : lang.toUpperCase();
    }

    // Detect language
    (function() {
      const saved = localStorage.getItem('allma_lang');
      if (saved && i18n[saved]) { applyLanguage(saved); }
      else {
        const bl = (navigator.language || 'en').slice(0, 2).toLowerCase();
        applyLanguage(i18n[bl] ? bl : 'en');
      }
    })();

    // Desktop lang buttons
    document.querySelectorAll('.lang-btn-desktop').forEach(btn => {
      btn.addEventListener('click', () => {
        localStorage.setItem('allma_lang', btn.dataset.lang);
        applyLanguage(btn.dataset.lang);
      });
    });

    // Mobile dropdown
    const ddToggle = document.getElementById('langDropdownToggle');
    const ddMenu = document.getElementById('langDropdownMenu');
    if (ddToggle && ddMenu) {
      ddToggle.addEventListener('click', (e) => { e.stopPropagation(); ddMenu.classList.toggle('open'); });
      document.addEventListener('click', () => ddMenu.classList.remove('open'));
      ddMenu.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          localStorage.setItem('allma_lang', btn.dataset.lang);
          applyLanguage(btn.dataset.lang);
          ddMenu.classList.remove('open');
        });
      });
    }

    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    function getTheme() { const s = localStorage.getItem('allma_theme'); return s || (window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'); }
    function setTheme(t) { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('allma_theme', t); if (themeToggle) themeToggle.textContent = t === 'dark' ? '☀️' : '🌙'; var m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=t==='dark'?'#1A1A2E':'#FAF8F5'; }
    setTheme(getTheme());
    if (themeToggle) themeToggle.addEventListener('click', () => setTheme(getTheme() === 'dark' ? 'light' : 'dark'));
